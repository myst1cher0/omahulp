<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefoon Hulp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 22px;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f6f9;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            background-color: #e4e6eb;
            color: #333;
            padding: 10px 20px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #d8dadf;
        }
        h1 {
            color: #1a73e8;
            font-size: 32px;
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .warning {
            background: #fff3cd;
            border-left: 6px solid #ffc107;
        }
        .card img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <a href="../" class="back-btn">⬅ Terug naar Home</a>

    <h1>Telefoon Hulp</h1>

    <div class="card">
        <h2>De telefoon optimaliseren</h2>
<p>Open de <strong>Beveiliging-app</strong> (groen schildje) op de telefoon.</p>

<ul>
    <li><strong>Dagelijks:</strong> Tik op <strong>Snelheid verhogen</strong> (of <i>Boost snelheid</i>) om de telefoon snel te houden.</li>
    <li><strong>Wekelijks:</strong> Tik op <strong>Optimaliseren</strong> om de telefoon grondig op te meubelen.</li>
</ul>
        <img src="https://raw.githubusercontent.com/esajong/nfctag/refs/heads/main/IMG-20260903-WA0007.jpg" alt="Foto Beveiliging app openen">
        <img src="https://raw.githubusercontent.com/esajong/nfctag/refs/heads/main/IMG-20260903-WA0006.jpg" alt="Foto Optimaliseren van telefoon">
    </div>

</body>
</html>
